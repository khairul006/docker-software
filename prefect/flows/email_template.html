<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello from Prefect</title>
</head>

<body style="margin:0; padding:0; background-color:#eef1f4;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
        style="background-color:#eef1f4; padding:30px 0;">
        <tr>
            <td align="center">
                <table role="presentation" width="600" cellpadding="0" cellspacing="0"
                    style="background-color:#ffffff; border-radius:6px; overflow:hidden; box-shadow:0 2px 6px rgba(0,0,0,0.08);">

                    <!-- Top frame -->
                    <tr>
                        <td style="background-color:#0a2e4d; height:14px; font-size:0; line-height:0;">&nbsp;</td>
                    </tr>

                    <!-- Header -->
                    <tr>
                        <td style="padding:35px 40px 10px 40px;">
                            <h1
                                style="margin:0; font-family:Arial, Helvetica, sans-serif; color:#0a2e4d; font-size:22px;">
                                Hello from Prefect
                            </h1>
                        </td>
                    </tr>

                    <!-- Body -->
                    <tr>
                        <td
                            style="padding:10px 40px 25px 40px; font-family:Arial, Helvetica, sans-serif; color:#444444; font-size:15px; line-height:1.6;">
                            <p style="margin:0 0 15px 0;">
                                This is your scheduled update, delivered automatically via Prefect.
                            </p>
                            <p style="margin:0;">
                                Everything is running as expected — no action needed.
                            </p>
                        </td>
                    </tr>

                    <!-- Divider -->
                    <tr>
                        <td style="padding:0 40px;">
                            <div style="border-top:1px solid #e5e8eb;"></div>
                        </td>
                    </tr>

                    <!-- Meme link button -->
                    <tr>
                        <td align="center" style="padding:10px 40px 30px 40px;">
                            <img src="cid:meme_image" alt="meme" width="400"
                                style="max-width:100%; height:auto; border-radius:6px; display:block;">
                        </td>
                    </tr>

                    <!-- Footer note -->
                    <tr>
                        <td
                            style="padding:0 40px 30px 40px; font-family:Arial, Helvetica, sans-serif; color:#999999; font-size:12px; text-align:center;">
                            Sent automatically — no reply needed.
                        </td>
                    </tr>

                    <!-- Bottom frame -->
                    <tr>
                        <td style="background-color:#0a2e4d; height:14px; font-size:0; line-height:0;">&nbsp;</td>
                    </tr>

                </table>
            </td>
        </tr>
    </table>
</body>

</html>

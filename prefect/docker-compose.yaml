version: "3.9"

# Self-hosted Prefect server + Postgres backend, with an optional worker
# for running flows via deployments (process-based, no extra infra needed).
#
# Quick start:
#   docker compose up -d
#   Open the UI at http://localhost:4200
#
# Point your local `prefect` CLI / flow code at this server:
#   export PREFECT_API_URL=http://localhost:4200/api
#
# Then just run a flow script directly (python my_flow.py) — no worker
# needed unless you're using deployments/schedules.

services:
  prefect-postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: prefect
      POSTGRES_PASSWORD: prefect
      POSTGRES_DB: prefect
    volumes:
      - ./postgres-data:/var/lib/postgresql/data   # Persistent data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prefect"]
      interval: 5s
      timeout: 5s
      retries: 10
#     networks:
#       - shared-network

  prefect-server:
    image: prefecthq/prefect:3-latest
    restart: unless-stopped
    entrypoint: ["prefect", "server", "start", "--host", "0.0.0.0"]
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://prefect:prefect@prefect-postgres:5432/prefect
      PREFECT_SERVER_API_HOST: 0.0.0.0
      PREFECT_UI_URL: http://localhost:4200/api
      PREFECT_API_URL: http://localhost:4200/api
    ports:
      - "4200:4200"
    depends_on:
      prefect-postgres:
        condition: service_healthy
    healthcheck:
      # Prefect's image doesn't ship curl/wget, so use python's stdlib
      # to hit the health endpoint instead.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health', timeout=5)",
        ]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 30s
#     networks:
#       - shared-network

  # Optional: a process worker that polls a work pool and runs deployed
  # flows on a schedule. Skip this if you only run flows ad hoc with
  # `python my_flow.py`.
  prefect-worker:
    image: prefecthq/prefect:3-latest
    restart: unless-stopped
    entrypoint:
      [
        "prefect",
        "worker",
        "start",
        "--pool",
        "default-process-pool",
        "--type",
        "process",
      ]
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
    volumes:
      - ./flows:/opt/prefect/flows
      - ./.env:/opt/prefect/.env
    working_dir: /opt/prefect/flows
    depends_on:
      prefect-server:
        condition: service_healthy
#     networks:
#       - shared-network

# networks:
#   shared-network:
#     external: true